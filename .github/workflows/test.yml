name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # match.py is the signal-validity core; its tests need only rapidfuzz + pytest (fast, no scrapers)
      - run: pip install rapidfuzz pytest
      - run: python -m pytest tests/ -q
